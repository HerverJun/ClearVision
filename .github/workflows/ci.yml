name: ClearVision CI/CD

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: ""
      detection_gate_profile:
        description: "Detection performance gate profile (auto|standard|acceptance)"
        required: false
        default: "auto"
      detection_tighten_from_utc:
        description: "Optional UTC timestamp to auto-tighten detection budget (example: 2026-05-01T00:00:00Z)"
        required: false
        default: ""

env:
  SOLUTION_PATH: Acme.Product/Acme.Product.sln
  DESKTOP_PROJECT: Acme.Product/src/Acme.Product.Desktop/Acme.Product.Desktop.csproj
  PRODUCT_TEST_PROJECT: Acme.Product/tests/Acme.Product.Tests/Acme.Product.Tests.csproj
  DESKTOP_TEST_PROJECT: Acme.Product/tests/Acme.Product.Desktop.Tests/Acme.Product.Desktop.Tests.csproj
  OPERATOR_PROJECT: Acme.OperatorLibrary/Acme.OperatorLibrary.csproj
  OPERATOR_SMOKE_TEST_PROJECT: Acme.OperatorLibrary/tests/Acme.OperatorLibrary.SmokeTests/Acme.OperatorLibrary.SmokeTests.csproj
  OPERATOR_BENCHMARK_PROJECT: quality/tools/OperatorPerformanceBenchmarkRunner/OperatorPerformanceBenchmarkRunner.csproj
  OPERATOR_PACKAGE_DIR: Acme.OperatorLibrary/nupkg
  PUBLISH_DIR: ./publish
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan
        shell: pwsh
        run: '& "./scripts/scan-secrets.ps1"'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH
          dotnet restore $env:PRODUCT_TEST_PROJECT
          dotnet restore $env:DESKTOP_TEST_PROJECT

      - name: Generate Operator Catalog
        run: dotnet run --project scripts/OperatorDocGenerator/OperatorDocGenerator.csproj -- .

      - name: Upload Operator Catalog
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-catalog
          path: |
            ./算子资料/算子目录.json
            ./算子资料/算子目录.md

      - name: Build (Debug)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Debug --no-restore

      - name: Run Product Tests with Coverage
        run: >
          dotnet test ${{ env.PRODUCT_TEST_PROJECT }}
          --configuration Debug
          --no-restore
          --verbosity normal
          --logger trx
          --results-directory TestResults/product
          --collect:"XPlat Code Coverage"

      - name: Run Desktop Tests with Coverage
        run: >
          dotnet test ${{ env.DESKTOP_TEST_PROJECT }}
          --configuration Debug
          --no-restore
          --verbosity normal
          --logger trx
          --results-directory TestResults/desktop
          --collect:"XPlat Code Coverage"

      - name: Run Detection Regression Gate
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate regression `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Accuracy Gate
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate detection-accuracy `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Stability Gate
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate detection-stability `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Performance Gate
        shell: pwsh
        env:
          DETECTION_GATE_PROFILE: ${{ github.event.inputs.detection_gate_profile || 'auto' }}
          DETECTION_TIGHTEN_FROM_UTC: ${{ github.event.inputs.detection_tighten_from_utc || vars.CV_DETECTION_PERF_TIGHTEN_FROM_UTC || '' }}
        run: |
          $parameters = @{
            GateProfile = $env:DETECTION_GATE_PROFILE
            NoBuild = $true
            NoRestore = $true
            Verbosity = "minimal"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:DETECTION_TIGHTEN_FROM_UTC)) {
            $parameters.TightenFromUtc = $env:DETECTION_TIGHTEN_FROM_UTC
          }
          & "./scripts/run-tests-detection-performance.ps1" @parameters

      - name: Upload Detection Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-performance-report
          path: |
            Acme.Product/test_results/detection_performance_budget_report.md
            Acme.Product/test_results/detection_performance_budget_report.json
            Acme.Product/test_results/archive/detection_performance_failures/**

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml

      - name: Restore OperatorLibrary Package Project
        run: dotnet restore ${{ env.OPERATOR_PROJECT }}

      - name: Build OperatorLibrary Package Project
        run: dotnet build ${{ env.OPERATOR_PROJECT }} --configuration Release --no-restore

      - name: Pack OperatorLibrary
        shell: pwsh
        run: |
          $versionPrefix = (dotnet msbuild ${{ env.OPERATOR_PROJECT }} -getProperty:VersionPrefix | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($versionPrefix)) {
            throw "Could not determine OperatorLibrary VersionPrefix."
          }
          $env:OPERATOR_PACKAGE_VERSION = "$versionPrefix-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          dotnet pack ${{ env.OPERATOR_PROJECT }} `
            --configuration Release `
            --no-build `
            --output "${{ env.OPERATOR_PACKAGE_DIR }}" `
            -p:PackageVersion=$env:OPERATOR_PACKAGE_VERSION
          "OPERATOR_PACKAGE_VERSION=$env:OPERATOR_PACKAGE_VERSION" >> $env:GITHUB_ENV

      - name: Smoke Test OperatorLibrary Package with Coverage
        shell: pwsh
        run: |
          dotnet restore ${{ env.OPERATOR_SMOKE_TEST_PROJECT }} `
            --configfile Acme.OperatorLibrary/nuget.config `
            --source "${{ env.OPERATOR_PACKAGE_DIR }}" `
            --source "https://api.nuget.org/v3/index.json" `
            -p:AcmeOperatorLibraryPackageVersion=$env:OPERATOR_PACKAGE_VERSION
          dotnet test ${{ env.OPERATOR_SMOKE_TEST_PROJECT }} `
            --configuration Release `
            --no-restore `
            --verbosity normal `
            --logger trx `
            --results-directory TestResults/operator-library `
            --collect "Code Coverage" `
            -p:AcmeOperatorLibraryPackageVersion=$env:OPERATOR_PACKAGE_VERSION

      - name: Upload OperatorLibrary Package Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-library-package
          path: |
            ${{ env.OPERATOR_PACKAGE_DIR }}/Acme.OperatorLibrary.*.nupkg
            ${{ env.OPERATOR_PACKAGE_DIR }}/Acme.OperatorLibrary.*.snupkg
            TestResults/operator-library/**/*.trx
            TestResults/operator-library/**/*.coverage

      - name: Run Operator Performance Benchmark Smoke
        run: >
          dotnet run --project ${{ env.OPERATOR_BENCHMARK_PROJECT }} --configuration Release --
          --mode smoke
          --output artifacts/operator-performance-benchmark.json
          --report artifacts/operator-performance-benchmark.md

      - name: Upload Operator Performance Benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-performance-benchmark
          path: |
            artifacts/operator-performance-benchmark.json
            artifacts/operator-performance-benchmark.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Acme.Product/tests/Acme.Product.UI.Tests/package-lock.json

      - name: Install UI Test Dependencies
        working-directory: Acme.Product/tests/Acme.Product.UI.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI Tests
        working-directory: Acme.Product/tests/Acme.Product.UI.Tests
        run: npx playwright test

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            Acme.Product/tests/Acme.Product.UI.Tests/playwright-report/
            Acme.Product/tests/Acme.Product.UI.Tests/test-results/

  release-build:
    name: Release Build
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Get Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref }}' -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = '1.0.0-' + (Get-Date -Format 'yyyyMMdd-HHmmss')
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Publish Single File
        run: |
          dotnet publish ${{ env.DESKTOP_PROJECT }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}"

      - name: Create Launcher Script
        shell: pwsh
        run: |
          $content = "@echo off`nchcp 65001 >nul`necho 正在启动 ClearVision...`nstart `"`" `"%~dp0Acme.Product.Desktop.exe`""
          $content | Out-File -FilePath "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}/启动 ClearVision.bat" -Encoding UTF8

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}/*" -DestinationPath "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearVision-Build-${{ steps.version.outputs.VERSION }}
          path: ${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}-win-x64.zip
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: Code Quality
    runs-on: windows-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Check Code Format (Report Only)
        continue-on-error: true
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic

      - name: Run Static Analysis
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -warnaserror
