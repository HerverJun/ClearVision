name: ClearVision CI/CD

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: ""
      detection_gate_profile:
        description: "Detection performance gate profile (auto|standard|acceptance)"
        required: false
        default: "auto"
      detection_tighten_from_utc:
        description: "Optional UTC timestamp to auto-tighten detection budget (example: 2026-05-01T00:00:00Z)"
        required: false
        default: ""
      acknowledge_release_manual:
        description: "Acknowledge required device/human/package evidence for Release / Manual lane"
        required: false
        type: boolean
        default: false

env:
  SOLUTION_PATH: ClearVision.Product/ClearVision.Product.sln
  DESKTOP_PROJECT: ClearVision.Product/src/ClearVision.Product.Desktop/ClearVision.Product.Desktop.csproj
  PRODUCT_TEST_PROJECT: ClearVision.Product/tests/ClearVision.Product.Tests/ClearVision.Product.Tests.csproj
  DESKTOP_TEST_PROJECT: ClearVision.Product/tests/ClearVision.Product.Desktop.Tests/ClearVision.Product.Desktop.Tests.csproj
  OPERATOR_PROJECT: ClearVision.OperatorLibrary/ClearVision.OperatorLibrary.csproj
  OPERATOR_SMOKE_TEST_PROJECT: ClearVision.OperatorLibrary/tests/ClearVision.OperatorLibrary.SmokeTests/ClearVision.OperatorLibrary.SmokeTests.csproj
  OPERATOR_BENCHMARK_PROJECT: quality/tools/OperatorPerformanceBenchmarkRunner/OperatorPerformanceBenchmarkRunner.csproj
  OPERATOR_PACKAGE_DIR: ClearVision.OperatorLibrary/nupkg
  FRONTEND_V2_DIR: ClearVision.Product/src/ClearVision.Product.Desktop/FrontendV2
  PUBLISH_DIR: ./publish
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve CI Diff Base
        shell: pwsh
        run: |
          $baseRef = & "./scripts/resolve-ci-diff-base.ps1" `
            -EventName "${{ github.event_name }}" `
            -RefName "${{ github.ref_name }}" `
            -BeforeSha "${{ github.event.before }}" `
            -PullRequestBaseSha "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            throw "CI diff base resolver returned empty output."
          }
          "CV_DIFF_BASE=$baseRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CI diff base: $baseRef"

      - name: CI Gate Self Tests
        shell: pwsh
        run: |
          & "./scripts/resolve-ci-diff-base.ps1" -SelfTest
          & "./scripts/scan-secrets.ps1" -SelfTest

      - name: Secret Scan
        shell: pwsh
        run: '& "./scripts/scan-secrets.ps1" -BaseRef $env:CV_DIFF_BASE'

      - name: Text Encoding Scan
        shell: pwsh
        run: '& "./scripts/check-text-encoding.ps1" -BaseRef $env:CV_DIFF_BASE'

      - name: Diff Hygiene
        shell: pwsh
        run: '& "./scripts/check-diff-hygiene.ps1" -BaseRef $env:CV_DIFF_BASE'

      - name: Quality Report Size Scan
        shell: pwsh
        run: '& "./scripts/check-quality-report-size.ps1"'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH --locked-mode
          dotnet restore $env:PRODUCT_TEST_PROJECT --locked-mode
          dotnet restore $env:DESKTOP_TEST_PROJECT --locked-mode

      - name: Test Classification Governance
        shell: pwsh
        run: '& "./scripts/run-test-governance.ps1" -ReportDirectory TestResults/governance -FailOnWarning'

      - name: Generate Operator Catalog
        run: dotnet run --project scripts/OperatorDocGenerator/OperatorDocGenerator.csproj -- .

      - name: Audit Operator Library Read-Only (Report Only)
        shell: pwsh
        run: |
          & "./scripts/audit-operator-library-readonly.ps1" `
            -SourceCommitSha "${{ github.sha }}" `
            -ReportOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $jsonPath = "artifacts/operator-audit/operator-audit.json"
          $markdownPath = "artifacts/operator-audit/operator-audit.md"
          $summaryPath = "artifacts/operator-audit/operator-audit-summary.json"
          foreach ($path in @($jsonPath, $markdownPath, $summaryPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Operator audit output is missing: $path"
            }
          }

          $report = Get-Content -LiteralPath $jsonPath -Raw | ConvertFrom-Json
          $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne "2026-07-10.operator-audit.v4" -or
              $report.auditMode -ne "read-only" -or
              $report.sourceCommitSha -ne "${{ github.sha }}" -or
              $summary.schemaVersion -ne "2026-07-10.operator-audit-summary.v3" -or
              $summary.schemaValid -ne $true) {
            throw "Operator audit schema validation failed."
          }
          Write-Host ("Operator audit report-only counts: canonical={0}, aliases={1}, confirmed={2}, new-confirmed={3}, candidate={4}, not-reproduced={5}" -f `
            $summary.canonicalOperatorCount,
            $summary.legacyAliasCount,
            $summary.confirmedCount,
            $summary.newConfirmedCount,
            $summary.candidateCount,
            $summary.notReproducedCount)

      - name: Upload Operator Library Read-Only Audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-audit
          if-no-files-found: error
          path: |
            artifacts/operator-audit/operator-audit.json
            artifacts/operator-audit/operator-audit.md
            artifacts/operator-audit/operator-audit-summary.json

      - name: Upload Operator Catalog
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-catalog
          if-no-files-found: error
          path: |
            ./算子资料/算子目录.json
            ./算子资料/算子目录.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ClearVision.Product/tests/ClearVision.Product.UI.Tests/package-lock.json
            ClearVision.Product/src/ClearVision.Product.Desktop/FrontendV2/package-lock.json

      - name: Install FrontendV2 Dependencies
        working-directory: ${{ env.FRONTEND_V2_DIR }}
        run: npm ci

      - name: Run FrontendV2 Quality Gates
        working-directory: ${{ env.FRONTEND_V2_DIR }}
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit

      - name: Build (Debug)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Debug --no-restore -p:SkipFrontendV2Install=true

      - name: Run Product PR Lane with Coverage
        shell: pwsh
        run: |
          & "./scripts/run-classified-test-gate.ps1" `
            -Gate product-pr `
            -Configuration Debug `
            -NoRestore `
            -Verbosity normal `
            -ResultsDirectory TestResults/product `
            -LogFileName product.trx `
            -Collect "XPlat Code Coverage"

      - name: Run Product Performance Budget Tests
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-classified-test-gate.ps1" `
            -Gate product-nightly-performance-other `
            -Configuration Debug `
            -NoBuild `
            -NoRestore `
            -Verbosity normal `
            -ResultsDirectory TestResults/product-performance `
            -LogFileName product-performance.trx

      - name: Run Measurement Performance Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-tests-measurement-performance.ps1" `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal `
            -ResultsDirectory TestResults/measurement-performance `
            -LogFileName measurement-performance.trx `
            -ReportDirectory ClearVision.Product/test_results

      - name: Run Data Processing Remediation Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-tests-data-processing-remediation.ps1" `
            -Gate phase2 `
            -SkipDockerIntegration `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal `
            -ResultsDirectory TestResults/data-processing-remediation `
            -LogFileName data-processing-remediation.trx `
            -MinimumTotalTests 1

      - name: Run Desktop PR Lane with Coverage
        shell: pwsh
        run: |
          & "./scripts/run-classified-test-gate.ps1" `
            -Gate desktop-pr `
            -Configuration Debug `
            -NoRestore `
            -Verbosity normal `
            -ResultsDirectory TestResults/desktop `
            -LogFileName desktop.trx `
            -Collect "XPlat Code Coverage"

      - name: Write Coverage Summary
        shell: pwsh
        if: always()
        run: |
          $requiredCoverageRoots = @("TestResults/product", "TestResults/desktop")
          foreach ($root in $requiredCoverageRoots) {
            $rootFiles = Get-ChildItem -Path $root -Filter coverage.cobertura.xml -Recurse -File -ErrorAction SilentlyContinue
            if ($rootFiles.Count -eq 0) {
              throw "Expected at least one Cobertura coverage file under $root."
            }
          }

          $files = Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse -File -ErrorAction SilentlyContinue
          $lines = @("# Coverage Summary", "")
          $lines += "| File | Line rate | Branch rate |"
          $lines += "| --- | ---: | ---: |"
          foreach ($file in $files) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName
            if ($null -eq $xml.coverage -or $null -eq $xml.coverage.'line-rate' -or $null -eq $xml.coverage.'branch-rate') {
              throw "Cobertura coverage file is missing line-rate or branch-rate: $($file.FullName)"
            }

            $lineRate = [double]$xml.coverage.'line-rate'
            $branchRate = [double]$xml.coverage.'branch-rate'
            $relative = Resolve-Path -LiteralPath $file.FullName -Relative
            $lines += "| $relative | $([Math]::Round($lineRate * 100, 2))% | $([Math]::Round($branchRate * 100, 2))% |"
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $lines | Set-Content -Path TestResults/coverage-summary.md -Encoding UTF8
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Run Detection Regression Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate regression `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Accuracy Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate detection-accuracy `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Stability Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          & "./scripts/run-tests-detection-regression.ps1" `
            -Gate detection-stability `
            -NoBuild `
            -NoRestore `
            -Verbosity minimal

      - name: Run Detection Performance Gate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          DETECTION_GATE_PROFILE: ${{ github.event.inputs.detection_gate_profile || 'auto' }}
          DETECTION_TIGHTEN_FROM_UTC: ${{ github.event.inputs.detection_tighten_from_utc || vars.CV_DETECTION_PERF_TIGHTEN_FROM_UTC || '' }}
        run: |
          $parameters = @{
            GateProfile = $env:DETECTION_GATE_PROFILE
            NoBuild = $true
            NoRestore = $true
            Verbosity = "minimal"
            ResultsDirectory = "TestResults/detection-performance"
            LogFileName = "detection-performance.trx"
            ReportDirectory = "ClearVision.Product/test_results"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:DETECTION_TIGHTEN_FROM_UTC)) {
            $parameters.TightenFromUtc = $env:DETECTION_TIGHTEN_FROM_UTC
          }
          & "./scripts/run-tests-detection-performance.ps1" @parameters

      - name: Upload Detection Performance Report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: detection-performance-report
          if-no-files-found: error
          path: |
            ClearVision.Product/test_results/detection_performance_budget_report.md
            ClearVision.Product/test_results/detection_performance_budget_report.json
            ClearVision.Product/test_results/archive/detection_performance_failures/**

      - name: Upload Measurement Performance Report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: measurement-performance-report
          if-no-files-found: error
          path: |
            ClearVision.Product/test_results/measurement_performance_budget_report.md
            ClearVision.Product/test_results/measurement_performance_budget_report.json

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          if-no-files-found: error
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/coverage-summary.md

      - name: Restore OperatorLibrary Package Project
        run: dotnet restore ${{ env.OPERATOR_PROJECT }} --locked-mode

      - name: Build OperatorLibrary Package Project
        run: dotnet build ${{ env.OPERATOR_PROJECT }} --configuration Release --no-restore

      - name: Pack OperatorLibrary
        shell: pwsh
        run: |
          $versionPrefix = (dotnet msbuild ${{ env.OPERATOR_PROJECT }} -getProperty:VersionPrefix | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($versionPrefix)) {
            throw "Could not determine OperatorLibrary VersionPrefix."
          }
          $env:OPERATOR_PACKAGE_VERSION = "$versionPrefix-ci.${{ github.run_number }}.${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force -Path "${{ env.OPERATOR_PACKAGE_DIR }}" | Out-Null
          dotnet pack ${{ env.OPERATOR_PROJECT }} `
            --configuration Release `
            --no-build `
            --output "${{ env.OPERATOR_PACKAGE_DIR }}" `
            -p:PackageVersion=$env:OPERATOR_PACKAGE_VERSION
          "OPERATOR_PACKAGE_VERSION=$env:OPERATOR_PACKAGE_VERSION" >> $env:GITHUB_ENV

      - name: Smoke Test OperatorLibrary Package with Coverage
        shell: pwsh
        run: |
          $smokeLockPath = Join-Path $env:RUNNER_TEMP "operator-library-smoke.packages.lock.json"
          dotnet restore ${{ env.OPERATOR_SMOKE_TEST_PROJECT }} `
            --configfile ClearVision.OperatorLibrary/nuget.config `
            -p:NuGetLockFilePath=$smokeLockPath `
            -p:ClearVisionOperatorLibraryPackageVersion=$env:OPERATOR_PACKAGE_VERSION
          & "./scripts/run-classified-test-gate.ps1" `
            -Gate operator-library-smoke `
            -Configuration Release `
            -NoRestore `
            -Verbosity normal `
            -ResultsDirectory TestResults/operator-library `
            -LogFileName operator-library.trx `
            -Collect "Code Coverage" `
            -DotNetTestArguments "-p:ClearVisionOperatorLibraryPackageVersion=$env:OPERATOR_PACKAGE_VERSION"

      - name: Upload OperatorLibrary Package Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-library-package
          if-no-files-found: error
          path: |
            ${{ env.OPERATOR_PACKAGE_DIR }}/ClearVision.OperatorLibrary.*.nupkg
            ${{ env.OPERATOR_PACKAGE_DIR }}/ClearVision.OperatorLibrary.*.snupkg
            TestResults/operator-library/**/*.trx
            TestResults/operator-library/**/*.coverage
            ClearVision.OperatorLibrary/SBOM.md
            ClearVision.OperatorLibrary/SBOM.spdx.json
            ClearVision.OperatorLibrary/THIRD-PARTY-NOTICES.md

      - name: Run Operator Performance Benchmark Smoke
        shell: pwsh
        run: |
          $startedAtUtc = [DateTime]::UtcNow
          $outputPath = "artifacts/operator-performance-benchmark.json"
          $reportPath = "artifacts/operator-performance-benchmark.md"
          dotnet run --project $env:OPERATOR_BENCHMARK_PROJECT --configuration Release -- `
            --mode smoke `
            --output $outputPath `
            --report $reportPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          foreach ($path in @($outputPath, $reportPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Operator performance benchmark artifact was not produced: $path"
            }

            $artifact = Get-Item -LiteralPath $path
            if ($artifact.LastWriteTimeUtc -lt $startedAtUtc) {
              throw "Operator performance benchmark artifact is stale: $path"
            }
          }

          $benchmark = Get-Content -LiteralPath $outputPath -Raw | ConvertFrom-Json
          if ($benchmark.summary.mode -ne "smoke") {
            throw "Operator performance benchmark mode mismatch: $($benchmark.summary.mode)"
          }
          if ([int]$benchmark.summary.caseCount -lt 4 -or [int]$benchmark.summary.passed -lt 4 -or [int]$benchmark.summary.failed -ne 0) {
            throw "Operator performance benchmark smoke coverage regressed: caseCount=$($benchmark.summary.caseCount), passed=$($benchmark.summary.passed), failed=$($benchmark.summary.failed)"
          }
          Write-Host "Operator performance benchmark artifact validation passed."

      - name: Upload Operator Performance Benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-performance-benchmark
          if-no-files-found: error
          path: |
            artifacts/operator-performance-benchmark.json
            artifacts/operator-performance-benchmark.md

      - name: Run Quick Contract Quality Suite
        shell: pwsh
        run: python quality/tools/run_quality_suite.py --suite quick_contract_suite --run

      - name: Upload Quick Contract Quality Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-contract-quality-suite
          if-no-files-found: error
          path: |
            quality/evals/reports/*_contract_baseline.json
            quality/evals/reports/*_contract_baseline.md
            quality/evals/reports/P3CoreContracts_baseline.json
            quality/evals/reports/P3CoreContracts_baseline.md
            quality/evals/reports/G1P3ContractBatch1_baseline.json
            quality/evals/reports/G1P3ContractBatch1_baseline.md
            quality/evals/reports/G1P3ContractBatch2_baseline.json
            quality/evals/reports/G1P3ContractBatch2_baseline.md

      - name: Install UI Test Dependencies
        working-directory: ClearVision.Product/tests/ClearVision.Product.UI.Tests
        run: |
          npm ci
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            npx playwright install --with-deps chromium
          }

      - name: Run Vision Agent Quality Suite
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: python quality/tools/run_quality_suite.py --suite agent_engineering_harness_suite --run

      - name: Generate Real LLM Shadow Eval Sample
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          dotnet run --project quality/tools/VisionAgentPlannerShadowEvalRunner/VisionAgentPlannerShadowEvalRunner.csproj -- --output quality/evals/reports/real_llm_planner_shadow_eval.json --report quality/evals/reports/real_llm_planner_shadow_eval.md
          dotnet run --project quality/tools/VisionAgentPlannerShadowEvalRunner/VisionAgentPlannerShadowEvalRunner.csproj -- --case-set holdout --output quality/evals/reports/real_llm_planner_shadow_eval.holdout.json --report quality/evals/reports/real_llm_planner_shadow_eval.holdout.md

      - name: Assert Vision Agent Artifact Reports
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: python quality/tools/assert_vision_agent_report_artifacts.py --require-non-local-workflow-run --scan-source-files --write-manifest quality/evals/reports/vision_agent_quality_artifact_manifest.json --write-report quality/evals/reports/vision_agent_quality_artifact_manifest.md

      - name: Upload Vision Agent Quality Reports
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: vision-agent-quality-suite
          if-no-files-found: error
          path: |
            quality/evals/reports/VisionAgent_business_benchmark_baseline.json
            quality/evals/reports/VisionAgent_business_benchmark_baseline.md
            quality/evals/reports/planner_autonomy_benchmark.json
            quality/evals/reports/planner_autonomy_benchmark.md
            quality/evals/reports/runtime_preview_scenario_corpus.json
            quality/evals/reports/runtime_preview_scenario_corpus.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus_v2.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus_v2.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus_final.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus_final.md
            quality/evals/reports/runtime_preview_scenario_evidence.json
            quality/evals/reports/runtime_preview_scenario_evidence.md
            quality/evals/reports/runtime_preview_deploy_readiness_report.sample.json
            quality/evals/reports/runtime_preview_deploy_readiness_report.sample.md
            quality/evals/reports/runtime_preview_package_readiness_report.sample.json
            quality/evals/reports/runtime_preview_package_readiness_report.sample.md
            quality/evals/reports/runtime_preview_package_readiness_final.json
            quality/evals/reports/runtime_preview_package_readiness_final.md
            quality/evals/reports/runtime_package_manifest_dry_run.sample.json
            quality/evals/reports/runtime_package_manifest_dry_run.sample.md
            quality/evals/reports/runtime_package_manifest_dry_run_final.json
            quality/evals/reports/runtime_package_manifest_dry_run_final.md
            quality/evals/reports/runtime_preview_station_profiles_sample.json
            quality/evals/reports/runtime_preview_station_profiles_sample.md
            quality/evals/reports/runtime_preview_station_profiles_final.json
            quality/evals/reports/runtime_preview_station_profiles_final.md
            quality/evals/reports/runtime_preview_operator_contract_registry.json
            quality/evals/reports/runtime_preview_operator_contract_registry.md
            quality/evals/reports/runtime_preview_operator_contract_registry_final.json
            quality/evals/reports/runtime_preview_operator_contract_registry_final.md
            quality/evals/reports/runtime_preview_operator_contract_coverage.json
            quality/evals/reports/runtime_preview_operator_contract_coverage.md
            quality/evals/reports/runtime_preview_operator_contract_validation_sample.json
            quality/evals/reports/runtime_preview_operator_contract_validation_sample.md
            quality/evals/reports/runtime_preview_operator_contract_validation_final.json
            quality/evals/reports/runtime_preview_operator_contract_validation_final.md
            quality/evals/reports/runtime_preview_station_compatibility_dry_run.sample.json
            quality/evals/reports/runtime_preview_station_compatibility_dry_run.sample.md
            quality/evals/reports/runtime_preview_station_compatibility_final.json
            quality/evals/reports/runtime_preview_station_compatibility_final.md
            quality/evals/reports/runtime_preview_pre_release_review_report.sample.json
            quality/evals/reports/runtime_preview_pre_release_review_report.sample.md
            quality/evals/reports/runtime_preview_pre_release_review_final.json
            quality/evals/reports/runtime_preview_pre_release_review_final.md
            quality/evals/reports/runtime_preview_release_decision_matrix.json
            quality/evals/reports/runtime_preview_release_decision_matrix.md
            quality/evals/reports/runtime_preview_governance_audit_sample.json
            quality/evals/reports/runtime_preview_governance_audit_sample.md
            quality/evals/reports/runtime_preview_governance_export_sample.json
            quality/evals/reports/runtime_preview_governance_export_sample.md
            quality/evals/reports/runtime_preview_governance_export_final.json
            quality/evals/reports/runtime_preview_governance_export_final.md
            quality/evals/reports/runtime_preview_agent_explanation_benchmark.json
            quality/evals/reports/runtime_preview_agent_explanation_benchmark.md
            quality/evals/reports/runtime_preview_agent_explanation_v3.json
            quality/evals/reports/runtime_preview_agent_explanation_v3.md
            quality/evals/reports/runtime_preview_agent_explanation_final.json
            quality/evals/reports/runtime_preview_agent_explanation_final.md
            quality/evals/reports/runtime_preview_report_readability_gate.json
            quality/evals/reports/runtime_preview_report_readability_gate.md
            quality/evals/reports/real_llm_planner_shadow_eval.json
            quality/evals/reports/real_llm_planner_shadow_eval.md
            quality/evals/reports/real_llm_planner_shadow_eval.holdout.json
            quality/evals/reports/real_llm_planner_shadow_eval.holdout.md
            quality/evals/reports/vision_agent_quality_artifact_manifest.json
            quality/evals/reports/vision_agent_quality_artifact_manifest.md
            test_results/agent_engineering_harness/**/*.trx
            test_results/agent_engineering_harness/agent_ui_contract_output.txt

      - name: Run UI Unit Tests
        working-directory: ClearVision.Product/tests/ClearVision.Product.UI.Tests
        run: npm run test:unit

      - name: Run UI E2E Tests
        if: github.event_name == 'workflow_dispatch'
        working-directory: ClearVision.Product/tests/ClearVision.Product.UI.Tests
        run: |
          npm run test:preview-smoke
          npx playwright test

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: ui-test-results
          if-no-files-found: error
          path: |
            ClearVision.Product/tests/ClearVision.Product.UI.Tests/playwright-report/
            ClearVision.Product/tests/ClearVision.Product.UI.Tests/test-results/

  nightly-lane:
    name: Nightly Quality Lane
    runs-on: windows-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ClearVision.Product/tests/ClearVision.Product.UI.Tests/package-lock.json
            ClearVision.Product/src/ClearVision.Product.Desktop/FrontendV2/package-lock.json

      - name: Restore and Build Nightly Projects
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION_PATH --locked-mode
          dotnet restore $env:PRODUCT_TEST_PROJECT --locked-mode
          dotnet restore $env:DESKTOP_TEST_PROJECT --locked-mode
          dotnet build $env:SOLUTION_PATH --configuration Debug --no-restore -p:SkipFrontendV2Install=true
          dotnet build $env:PRODUCT_TEST_PROJECT --configuration Debug --no-restore
          dotnet build $env:DESKTOP_TEST_PROJECT --configuration Debug --no-restore

      - name: Install Nightly UI Dependencies
        shell: pwsh
        run: |
          Push-Location $env:FRONTEND_V2_DIR
          npm ci
          Pop-Location
          Push-Location ClearVision.Product/tests/ClearVision.Product.UI.Tests
          npm ci
          Pop-Location

      - name: Prepare OperatorLibrary Smoke Package
        shell: pwsh
        run: |
          dotnet restore $env:OPERATOR_PROJECT --locked-mode
          dotnet build $env:OPERATOR_PROJECT --configuration Release --no-restore
          $versionPrefix = (dotnet msbuild $env:OPERATOR_PROJECT -getProperty:VersionPrefix | Select-Object -Last 1).Trim()
          $packageVersion = "$versionPrefix-nightly.${{ github.run_number }}.${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force -Path $env:OPERATOR_PACKAGE_DIR | Out-Null
          dotnet pack $env:OPERATOR_PROJECT --configuration Release --no-build --output $env:OPERATOR_PACKAGE_DIR -p:PackageVersion=$packageVersion
          $smokeLockPath = Join-Path $env:RUNNER_TEMP "operator-library-nightly-smoke.packages.lock.json"
          dotnet restore $env:OPERATOR_SMOKE_TEST_PROJECT --configfile ClearVision.OperatorLibrary/nuget.config -p:NuGetLockFilePath=$smokeLockPath -p:ClearVisionOperatorLibraryPackageVersion=$packageVersion
          dotnet build $env:OPERATOR_SMOKE_TEST_PROJECT --no-restore -p:ClearVisionOperatorLibraryPackageVersion=$packageVersion

      - name: Run Nightly Lane
        shell: pwsh
        run: |
          & "./scripts/run-test-quality-lane.ps1" `
            -Lane Nightly `
            -Configuration Debug `
            -NoBuild `
            -NoRestore `
            -ResultsRoot TestResults/nightly

      - name: Upload Nightly Lane Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-quality-lane
          if-no-files-found: error
          path: TestResults/nightly/**

  operator-precision-benchmark:
    name: Operator Precision Benchmark (Nightly / Manual)
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Benchmark Runners
        shell: pwsh
        run: |
          dotnet restore quality/tools/OperatorPrecisionBenchmarkRunner/OperatorPrecisionBenchmarkRunner.csproj
          dotnet restore quality/tools/OperatorProductE2EBenchmarkRunner/OperatorProductE2EBenchmarkRunner.csproj

      - name: Run Supplemental Kernel Acceptance Evidence
        shell: pwsh
        run: |
          & "./scripts/run-operator-precision-benchmark.ps1" `
            -Profile acceptance `
            -Label baseline `
            -ResultsDirectory "TestResults/operator-precision"
          & "./scripts/run-operator-precision-benchmark.ps1" `
            -Profile acceptance `
            -Label after `
            -ResultsDirectory "TestResults/operator-precision"
          & "./scripts/compare-operator-precision-benchmarks.ps1" `
            -BaselinePath "TestResults/operator-precision/operator-precision-baseline-acceptance.json" `
            -AfterPath "TestResults/operator-precision/operator-precision-after-acceptance.json" `
            -OutputPath "TestResults/operator-precision/operator-precision-phase5-comparison.json" `
            -ReportPath "TestResults/operator-precision/operator-precision-phase5-comparison.md"

      - name: Run Executable Product Baseline and Formal Operator E2E Evidence
        shell: pwsh
        run: |
          & "./scripts/run-operator-product-e2e-evidence.ps1" `
            -Profile acceptance `
            -ResultsDirectory "TestResults/operator-precision"

      - name: Upload Operator Precision Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-precision-benchmark
          if-no-files-found: error
          path: TestResults/operator-precision/**

  industrial-gate:
    name: Release / Manual Quality Lane
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Debug --no-restore

      - name: Prepare OperatorLibrary Smoke Package
        shell: pwsh
        run: |
          dotnet restore $env:OPERATOR_PROJECT --locked-mode
          dotnet build $env:OPERATOR_PROJECT --configuration Release --no-restore
          $versionPrefix = (dotnet msbuild $env:OPERATOR_PROJECT -getProperty:VersionPrefix | Select-Object -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($versionPrefix)) {
            throw "Could not determine OperatorLibrary VersionPrefix."
          }
          $packageVersion = "$versionPrefix-industrial.${{ github.run_number }}.${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force -Path $env:OPERATOR_PACKAGE_DIR | Out-Null
          dotnet pack $env:OPERATOR_PROJECT `
            --configuration Release `
            --no-build `
            --output $env:OPERATOR_PACKAGE_DIR `
            -p:PackageVersion=$packageVersion
          $smokeLockPath = Join-Path $env:RUNNER_TEMP "operator-library-industrial-smoke.packages.lock.json"
          dotnet restore $env:OPERATOR_SMOKE_TEST_PROJECT `
            --configfile ClearVision.OperatorLibrary/nuget.config `
            -p:NuGetLockFilePath=$smokeLockPath `
            -p:ClearVisionOperatorLibraryPackageVersion=$packageVersion
          dotnet build $env:OPERATOR_SMOKE_TEST_PROJECT `
            --no-restore `
            -p:ClearVisionOperatorLibraryPackageVersion=$packageVersion

      - name: Run Release / Manual Lane
        shell: pwsh
        run: |
          $parameters = @{
            Lane = "ReleaseManual"
            NoBuild = $true
            NoRestore = $true
            Verbosity = "minimal"
            ResultsRoot = "TestResults/release-manual"
          }
          if ('${{ github.event.inputs.acknowledge_release_manual }}' -eq 'true') {
            $parameters.AcknowledgeManualRequirements = $true
          }
          & "./scripts/run-test-quality-lane.ps1" @parameters

      - name: Upload Industrial Gate Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manual-quality-lane
          if-no-files-found: error
          path: |
            TestResults/release-manual/**
            test_results/operator-library-industrial-gate/**/summary.json
            test_results/operator-library-industrial-gate/**/summary.md
            test_results/operator-library-industrial-gate/**/trx/**/*.trx
            test_results/operator-library-industrial-gate/**/performance-reports/**

  release-build:
    name: Release Build
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Release / Manual Evidence Binding
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          APPROVED_RELEASE_SHA: ${{ vars.CV_RELEASE_MANUAL_APPROVED_SHA }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APPROVED_RELEASE_SHA) -or $env:APPROVED_RELEASE_SHA -ne "${{ github.sha }}") {
            throw "Release tag is not bound to completed Release / Manual evidence. Set CV_RELEASE_MANUAL_APPROVED_SHA to the exact approved commit SHA after the manual lane succeeds."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --locked-mode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            ClearVision.Product/tests/ClearVision.Product.UI.Tests/package-lock.json
            ClearVision.Product/src/ClearVision.Product.Desktop/FrontendV2/package-lock.json

      - name: Install FrontendV2 Dependencies
        working-directory: ${{ env.FRONTEND_V2_DIR }}
        run: npm ci

      - name: Get Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref }}' -match 'refs/tags/v(.+)') {
            $version = $matches[1]
          } else {
            $version = '1.0.0-' + (Get-Date -Format 'yyyyMMdd-HHmmss')
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Publish Single File
        run: |
          dotnet publish ${{ env.DESKTOP_PROJECT }} `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:SkipFrontendV2Install=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}"

      - name: Create Launcher Script
        shell: pwsh
        run: |
          $content = "@echo off`nchcp 65001 >nul`necho Starting ClearVision...`nstart `"`" `"%~dp0ClearVision.Product.Desktop.exe`""
          $content | Out-File -FilePath "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}/Start-ClearVision.bat" -Encoding UTF8

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}/*" -DestinationPath "${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}-win-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearVision-Build-${{ steps.version.outputs.VERSION }}
          if-no-files-found: error
          path: ${{ env.PUBLISH_DIR }}/ClearVision-${{ steps.version.outputs.VERSION }}-win-x64.zip
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: Code Quality
    runs-on: windows-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve CI Diff Base
        shell: pwsh
        run: |
          $baseRef = & "./scripts/resolve-ci-diff-base.ps1" `
            -EventName "${{ github.event_name }}" `
            -RefName "${{ github.ref_name }}" `
            -BeforeSha "${{ github.event.before }}" `
            -PullRequestBaseSha "${{ github.event.pull_request.base.sha }}"
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            throw "CI diff base resolver returned empty output."
          }
          "CV_DIFF_BASE=$baseRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CI diff base: $baseRef"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --locked-mode

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore

      - name: Check Code Format
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic

      - name: Diff Hygiene
        shell: pwsh
        run: '& "./scripts/check-diff-hygiene.ps1" -BaseRef $env:CV_DIFF_BASE'

      - name: Run Static Analysis
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -warnaserror
