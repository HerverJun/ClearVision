name: Vision Agent Quality Suite

on:
  push:
    branches: ["codex*"]
  workflow_dispatch:

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  agent-quality-suite:
    name: Agent Engineering Harness
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-agent-${{ hashFiles('global.json', '**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-agent-
            ${{ runner.os }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ClearVision.Product/tests/ClearVision.Product.UI.Tests/package-lock.json

      - name: Install UI Test Dependencies
        working-directory: ClearVision.Product/tests/ClearVision.Product.UI.Tests
        run: npm ci

      - name: Run Vision Agent Quality Suite
        shell: pwsh
        run: python quality/tools/run_quality_suite.py --suite agent_engineering_harness_suite --run

      - name: Generate Real LLM Shadow Eval Sample
        shell: pwsh
        run: |
          dotnet run --project quality/tools/VisionAgentPlannerShadowEvalRunner/VisionAgentPlannerShadowEvalRunner.csproj -- --output quality/evals/reports/real_llm_planner_shadow_eval.json --report quality/evals/reports/real_llm_planner_shadow_eval.md
          dotnet run --project quality/tools/VisionAgentPlannerShadowEvalRunner/VisionAgentPlannerShadowEvalRunner.csproj -- --case-set holdout --output quality/evals/reports/real_llm_planner_shadow_eval.holdout.json --report quality/evals/reports/real_llm_planner_shadow_eval.holdout.md

      - name: Assert Vision Agent Artifact Reports
        shell: pwsh
        run: python quality/tools/assert_vision_agent_report_artifacts.py --require-non-local-workflow-run --scan-source-files --write-manifest quality/evals/reports/vision_agent_quality_artifact_manifest.json --write-report quality/evals/reports/vision_agent_quality_artifact_manifest.md

      - name: Upload Vision Agent Quality Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-agent-quality-suite
          if-no-files-found: error
          path: |
            quality/evals/reports/VisionAgent_business_benchmark_baseline.json
            quality/evals/reports/VisionAgent_business_benchmark_baseline.md
            quality/evals/reports/planner_autonomy_benchmark.json
            quality/evals/reports/planner_autonomy_benchmark.md
            quality/evals/reports/runtime_preview_scenario_corpus.json
            quality/evals/reports/runtime_preview_scenario_corpus.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus_v2.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus_v2.md
            quality/evals/reports/runtime_preview_redacted_flow_corpus_final.json
            quality/evals/reports/runtime_preview_redacted_flow_corpus_final.md
            quality/evals/reports/runtime_preview_scenario_evidence.json
            quality/evals/reports/runtime_preview_scenario_evidence.md
            quality/evals/reports/runtime_preview_deploy_readiness_report.sample.json
            quality/evals/reports/runtime_preview_deploy_readiness_report.sample.md
            quality/evals/reports/runtime_preview_package_readiness_report.sample.json
            quality/evals/reports/runtime_preview_package_readiness_report.sample.md
            quality/evals/reports/runtime_preview_package_readiness_final.json
            quality/evals/reports/runtime_preview_package_readiness_final.md
            quality/evals/reports/runtime_package_manifest_dry_run.sample.json
            quality/evals/reports/runtime_package_manifest_dry_run.sample.md
            quality/evals/reports/runtime_package_manifest_dry_run_final.json
            quality/evals/reports/runtime_package_manifest_dry_run_final.md
            quality/evals/reports/runtime_preview_station_profiles_sample.json
            quality/evals/reports/runtime_preview_station_profiles_sample.md
            quality/evals/reports/runtime_preview_station_profiles_final.json
            quality/evals/reports/runtime_preview_station_profiles_final.md
            quality/evals/reports/runtime_preview_operator_contract_registry.json
            quality/evals/reports/runtime_preview_operator_contract_registry.md
            quality/evals/reports/runtime_preview_operator_contract_registry_final.json
            quality/evals/reports/runtime_preview_operator_contract_registry_final.md
            quality/evals/reports/runtime_preview_operator_contract_coverage.json
            quality/evals/reports/runtime_preview_operator_contract_coverage.md
            quality/evals/reports/runtime_preview_operator_contract_validation_sample.json
            quality/evals/reports/runtime_preview_operator_contract_validation_sample.md
            quality/evals/reports/runtime_preview_operator_contract_validation_final.json
            quality/evals/reports/runtime_preview_operator_contract_validation_final.md
            quality/evals/reports/runtime_preview_station_compatibility_dry_run.sample.json
