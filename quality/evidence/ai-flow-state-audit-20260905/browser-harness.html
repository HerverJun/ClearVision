<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearVision AI State Audit</title>
  <script type="module" src="./browser-harness.mjs"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; }
    #audit-controls { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-shrink: 0; border-bottom: 1px solid #777; font: 13px sans-serif; }
    #audit-panel { min-height: 0; flex: 1; }
    #audit-observation { white-space: pre-wrap; font: 12px monospace; margin: 0; }
  </style>
</head>
<body>
  <div id="audit-controls">
    <label for="audit-scenario">Audit Scenario</label>
    <select id="audit-scenario">
      <option value="new-plan">New Plan After Build</option>
      <option value="successful-restore">Restore Successful Build</option>
      <option value="draft-restore">Restore Draft Plan</option>
      <option value="readiness-timeout">Readiness Timeout</option>
    </select>
    <button id="audit-load" type="button">Load Scenario</button>
    <pre id="audit-observation">Loading</pre>
  </div>
  <div id="audit-panel"></div>
</body>
</html>
